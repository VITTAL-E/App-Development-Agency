<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="apexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="apexLetter" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#06B6D4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="15" fill="#0d111c" stroke="url(#apexBorder)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- "A" Glyph -->
  <!-- Left leg, Apex, Right leg -->
  <path d="M 20.5 43 L 30.5 19.5 C 31 18.5 32 18.5 32.5 19.5 L 42.5 43" stroke="url(#apexLetter)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crossbar -->
  <path d="M 24.5 35.5 L 38.5 35.5" stroke="url(#apexLetter)" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Degree Dot -->
  <circle cx="44" cy="18.5" r="4.5" fill="#06B6D4"/>
</svg>
